<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Coach</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <p id="status">Press Start and speak in English</p>

      <button id="main-btn">Start</button>

      <!-- My words (hidden by default, shown when toggle is on) -->
      <div id="transcript-box" class="hidden">
        <p class="box-label">You said</p>
        <span id="final-text"></span><span id="interim-text"></span>
      </div>

      <!-- Trainer response text (hidden by default, shown when toggle is on) -->
      <div id="trainer-box" class="hidden">
        <p class="box-label">Trainer</p>
        <span id="trainer-text"></span>
      </div>

      <!-- Toggles — off by default -->
      <div id="toggles">
        <label>
          <input type="checkbox" id="show-my-words">
          Show my words
        </label>
        <label>
          <input type="checkbox" id="show-trainer-text">
          Show trainer text
        </label>
      </div>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
