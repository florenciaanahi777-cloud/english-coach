<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Coach</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>

      <!-- Session progress bar (hidden on home screen) -->
      <div id="session-progress" class="hidden">
        <div class="progress-step" data-block="warmup">
          <span class="step-dot"></span>
          <span class="step-label">Warmup</span>
        </div>
        <div class="progress-connector"></div>
        <div class="progress-step" data-block="deepsim">
          <span class="step-dot"></span>
          <span class="step-label">Deep Sim</span>
        </div>
        <div class="progress-connector"></div>
        <div class="progress-step" data-block="micro">
          <span class="step-dot"></span>
          <span class="step-label">Vocabulary</span>
        </div>
        <div class="progress-connector"></div>
        <div class="progress-step" data-block="review">
          <span class="step-dot"></span>
          <span class="step-label">Review</span>
        </div>
      </div>

      <!-- Block + round indicator (hidden until session starts) -->
      <div id="session-header" class="hidden">
        <span id="block-label"></span>
        <span id="round-label"></span>
      </div>

      <!-- Stats panel — visible on home screen only -->
      <div id="stats-panel">
        <div id="streak-display"></div>
        <div id="avg-scores-display"></div>
      </div>

      <!-- Question Bank — visible on home screen only -->
      <div id="question-bank" class="hidden">
        <button id="qbank-toggle">Question Bank <span id="qbank-count"></span></button>
        <div id="qbank-list" class="hidden"></div>
      </div>

      <p id="status">Ready to practice?</p>

      <!-- Main action button -->
      <button id="main-btn">Begin</button>

      <!-- Score cards (shown after each answer) -->
      <div id="scores-box" class="hidden">
        <div class="score-card">
          <span class="score-label">Clarity</span>
          <span class="score-value" id="score-clarity">—</span>
        </div>
        <div class="score-card">
          <span class="score-label">Structure</span>
          <span class="score-value" id="score-structure">—</span>
        </div>
        <div class="score-card">
          <span class="score-label">Impact</span>
          <span class="score-value" id="score-impact">—</span>
        </div>
        <div class="score-card">
          <span class="score-label">English</span>
          <span class="score-value" id="score-english">—</span>
        </div>
      </div>

      <!-- Micro Activity (text only, no voice) -->
      <div id="micro-box" class="hidden"></div>

      <!-- End-of-session summary -->
      <div id="summary-box" class="hidden">
        <p class="box-label">Session Summary</p>
        <div id="summary-text"></div>
      </div>

      <!-- My words (toggle off by default) -->
      <div id="transcript-box" class="hidden">
        <p class="box-label">You said</p>
        <span id="final-text"></span><span id="interim-text"></span>
      </div>

      <!-- Trainer response text (toggle off by default) -->
      <div id="trainer-box" class="hidden">
        <p class="box-label">Trainer</p>
        <span id="trainer-text"></span>
      </div>

      <!-- Toggles -->
      <div id="toggles">
        <label>
          <input type="checkbox" id="show-my-words">
          Show my words
        </label>
        <label>
          <input type="checkbox" id="show-trainer-text">
          Show trainer text
        </label>
      </div>

    </main>
    <script src="app.js" defer></script>
  </body>
</html>
